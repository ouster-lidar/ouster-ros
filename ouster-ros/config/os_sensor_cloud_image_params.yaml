# [Not recommended] Use this configuration only when utilizing the disjointed
# os_sensor and os_cloud configuration
# For the future and for better results consider migrating to combined node/component os_driver
# and utilize the driver_params.yaml along with it. 
ouster/os_sensor:
  ros__parameters:
    sensor_hostname: ''
    udp_dest: ''
    mtp_dest: ''
    mtp_main: false
    lidar_mode: ''
    timestamp_mode: ''
    udp_profile_lidar: ''
    columns_per_packet: 0
    udp_profile_imu: ''
    imu_packets_per_frame: 0
    gyro_fsr: ''
    accel_fsr: ''
    metadata: ''
    lidar_port: 0
    imu_port: 0
    use_system_default_qos: false
    azimuth_window_start: 0
    azimuth_window_end: 360000
    operating_mode: NORMAL
    signal_multiplier: 1.0
    phase_lock_enable: false
    phase_lock_offset: 0
    lidar_frame_azimuth_offset: -1
    persist_config: false
    attempt_reconnect: false
    dormant_period_between_reconnects: 1.0
    max_failed_reconnect_attempts: 2147483647
ouster/os_cloud:
  ros__parameters:
    sensor_frame: os_sensor
    lidar_frame: os_lidar
    imu_frame: os_imu
    point_cloud_frame: os_lidar
    pub_static_tf: true
    timestamp_mode: ''  # this value needs to match os_sensor/timestamp_mode
    ptp_utc_tai_offset: -37.0 # UTC/TAI offset in seconds to apply when using TIME_FROM_PTP_1588
    proc_mask: IMU|PCL|SCAN|TLM # pick IMU, PCL, SCAN, TLM or any combination of the 4 options
    use_system_default_qos: false # needs to match the value defined for os_sensor node
    scan_ring: 0  # Use this parameter in conjunction with the SCAN flag and choose a
                  # value the range [0, sensor_beams_count)
    point_type: original # choose from: {original, native, xyz, xyzi, o_xyzi, xyzir, xyzrgb, xyzrgba}
ouster/os_image:
  ros__parameters:
    use_system_default_qos: false # needs to match the value defined for os_sensor node
    publish_camera_info: false # display-only approximation for the equirectangular panorama;
                               # use os_pinhole for pinhole geometry
    frame_id: os_lidar # frame_id for the published image and camera_info messages
    optical_frame: '' # explicit optical frame; when camera_info is enabled and
                      # this is empty, <frame_id>_panorama_optical_frame is used
ouster/os_pinhole:
  ros__parameters:
    # range_image is uint16 radial range at 4 mm/LSB, not optical-axis depth
    use_system_default_qos: false # needs to match os_sensor
    panel_names: [front, left, rear, right]
    panel_yaws_deg: [0.0, 90.0, 180.0, 270.0]
    panel_pitches_deg: [0.0] # one value is broadcast to every panel
    panel_hfovs_deg: [90.0]
    panel_widths: [256]
    panel_heights: [0] # 0 = derive height from the lidar vertical field of view
    panel_vfovs_deg: [0.0] # 0 = derive from metadata beam altitude angles
    parent_frame: os_lidar
    optical_frame_template: '{ns}/panels/{name}_optical_frame'
    azimuth_offset_deg: 0.0
